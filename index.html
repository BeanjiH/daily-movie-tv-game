<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CINEMIND</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="top-nav">
        <button id="help-btn" class="icon-btn" title="How to play">?</button>
      </div>
      <h1>CINEMIND</h1>
      <p id="daily-date" class="date-header">THE DAILY DEDUCTION</p>

      <!-- Category Toggle Bar -->
      <div class="category-toggle">
        <button id="tab-film" class="tab-btn active">🎬 Film</button>
        <button id="tab-tv" class="tab-btn">📺 TV</button>
      </div>

      <!-- 5-Clue Step Tracker -->
      <div id="progress-tracker" class="tracker">
        <div class="pip active"></div>
        <div class="pip"></div>
        <div class="pip"></div>
        <div class="pip"></div>
        <div class="pip"></div>
      </div>
    </header>

    <div id="clues-list">
      <!-- Clues render dynamically -->
    </div>

    <div class="guess-container">
      <input type="text" id="guess-input" placeholder="Enter title...">
      <button id="guess-btn">Guess</button>
    </div>

    <p id="status-message"></p>
  </div>

  <script src="films.js"></script>
  <script src="tv.js"></script>
  <script src="app.js"></script>
</body>
</html>
