<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CINEMIND</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>CINEMIND</h1>
      <p class="subtitle">The Daily Deduction</p>

      <!-- Category Toggle Bar -->
      <div class="category-toggle">
        <button id="tab-film" class="tab-btn active">🎬 Film</button>
        <button id="tab-tv" class="tab-btn">📺 TV</button>
      </div>
    </header>

    <div id="clues-list">
      <!-- Clues render dynamically -->
    </div>

    <div class="guess-container">
      <input type="text" id="guess-input" placeholder="Enter title...">
      <button id="guess-btn">Guess</button>
    </div>

    <p id="status-message"></p>
  </div>
  <script src="app.js"></script>
</body>
</html>
