<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Group scales the board down by 20% and centers it to prevent clipping -->
  <g transform="translate(6.5, 12) scale(0.8)">
    <!-- Main Board -->
    <rect x="6" y="26" width="52" height="34" rx="4" fill="#0a0807"/>
    
    <!-- Bottom Stick -->
    <rect x="6" y="16" width="52" height="8" fill="#0a0807"/>
    <polygon points="14,16 24,16 18,24 8,24" fill="#f4f4f4"/>
    <polygon points="34,16 44,16 38,24 28,24" fill="#f4f4f4"/>
    <polygon points="54,16 58,16 58,24 48,24" fill="#f4f4f4"/>
    
    <!-- Top Stick (Angled Open) -->
    <g transform="rotate(-18 6 16)">
      <rect x="6" y="6" width="52" height="8" fill="#0a0807"/>
      <polygon points="14,6 24,6 18,14 8,14" fill="#f4f4f4"/>
      <polygon points="34,6 44,6 38,14 28,14" fill="#f4f4f4"/>
      <polygon points="54,6 58,6 58,14 48,14" fill="#f4f4f4"/>
    </g>
    
    <!-- UI Theme Accents -->
    <rect x="14" y="36" width="36" height="6" rx="2" fill="#cc5555"/>
    <rect x="14" y="48" width="20" height="6" rx="2" fill="#d4af37"/>
  </g>
</svg>
